<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Blog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700&family=Inter:wght@300;400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">

    <h1 class="name">Seongyeon Hwang</h1>

    <div class="avatar">
      <img src="image/blog_main.jpg" alt="profile" />
    </div>

    <p class="clock">TIME IN MY CITY <span id="clock"></span> KST</p>

    <nav class="nav">
      <a href="index.html">home</a>
      <span>/</span>
      <a href="blog.html">blog</a>
      <span>/</span>
      <a href="about.html">about</a>
    </nav>

  </div>

  <script>
    // 시계
    function updateClock() {
      const time = new Date().toLocaleTimeString('ko-KR', {
        timeZone: 'Asia/Seoul',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: false
      });
      document.getElementById('clock').textContent = time;
    }
    updateClock();
    setInterval(updateClock, 1000);
  </script>

  <script data-goatcounter="https://lifeissogood.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
